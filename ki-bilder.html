<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Echt oder KI?</title>
<style>
:root{--bg:#f4f7fb;--text:#1f2a37;--card:#fff;--ok:#2e9d5b;--ok-light:#dff4e7;--no:#d64545;--no-light:#fbe3e3;--accent:#3b6fd8;--accent-light:#e3ecfb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-size:1.2rem;padding:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wrap{max-width:700px;margin:0 auto;text-align:center}
.top{display:flex;justify-content:space-between}
.home{width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
h1{font-size:2rem;margin:4px 0}
.sub{margin:0 0 12px}
.progress{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap;justify-content:center}
.dot{width:18px;height:18px;border-radius:50%;background:#cfd8e3}
.dot.done{background:var(--ok)}
.dot.now{background:var(--accent);transform:scale(1.25)}
.card{background:var(--card);border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:16px 56px;position:relative;margin:0 auto 12px;max-width:520px}
.card .who{font-size:1rem;color:#5a6675;text-align:left;margin-left:-40px;font-weight:bold}
.card .emoji{font-size:4rem;line-height:1.1}
.card .label{font-size:1.4rem;font-weight:bold;margin-top:8px}
.speak{position:absolute;top:8px;right:8px;border:none;background:#eef2f8;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer}
.q{font-size:1.3rem;font-weight:bold;margin:12px 0}
.opts{display:flex;gap:16px;justify-content:center}
.opts.col{flex-direction:column;align-items:stretch;max-width:560px;margin:0 auto;gap:12px}
.opt{flex:1;max-width:300px;min-height:90px;border-radius:20px;border:4px solid var(--accent);background:var(--accent-light);color:#1d3f8a;font:inherit;font-size:1.3rem;font-weight:bold;padding:12px;cursor:pointer}
.opts.col .opt{max-width:none;min-height:64px;font-weight:normal;font-size:1.2rem;text-align:left}
.opt.ok{border-color:var(--ok);background:var(--ok-light);color:#1c6b3c}
.opt.no{border-color:var(--no);background:var(--no-light);color:#9c2a2a}
.opt.right{border-color:var(--ok);background:var(--ok-light);color:#1c6b3c;font-weight:bold}
.opt:disabled{opacity:.4}
.opt.wrong{animation:shake .45s}
.feedback{min-height:56px;margin:12px auto;padding:10px 12px;border-radius:12px;max-width:600px;position:sticky;bottom:8px}
.feedback.good{background:var(--ok-light);color:#1c6b3c}
.feedback.bad{background:var(--no-light);color:#9c2a2a}
.feedback.info{background:#fff4d6;color:#7a5a00}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:16px;font:inherit;font-size:1.4rem;padding:14px 28px;cursor:pointer;margin-top:8px;text-decoration:none}
.btn.alt{background:#fff;color:var(--accent);border:3px solid var(--accent)}
.stars{font-size:3.5rem;margin:12px 0}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shake{animation:shake .45s}
.count{font-weight:bold;color:var(--accent)}
.feed{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.post{background:#fff;border:4px solid transparent;border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.1);padding:12px 14px;text-align:left;cursor:pointer}
.post .who{font-weight:bold;font-size:1rem;color:#5a6675;margin-bottom:6px}
.tag{font-weight:normal;font-size:.8rem;color:#8a94a3;margin-left:6px}
.post .row{display:flex;gap:12px;align-items:center}
.pe{font-size:2.6rem}
.post .why{font-size:1rem;margin-top:6px}
.post.found{border-color:var(--ok);background:var(--ok-light)}
.post.safe{opacity:.6;border-color:#cfd8e3}
.warn{background:#fff4d6;border:3px solid #e6b100;border-radius:16px;padding:10px;max-width:560px;margin:0 auto 12px}
.tip{background:var(--accent-light);border:3px solid var(--accent);border-radius:16px;padding:10px;max-width:560px;margin:12px auto}
.pw{width:100%;max-width:520px;font:inherit;font-size:1.6rem;padding:14px;border-radius:16px;border:4px solid #cfd8e3;text-align:center;user-select:text;-webkit-user-select:text}
.ampel{display:inline-flex;gap:10px;background:#2b3440;padding:10px 14px;border-radius:40px;margin:14px 0}
.ampel i{width:40px;height:40px;border-radius:50%;background:#55606e}
.ampel i.r{background:#e04b4b}
.ampel i.y{background:#f2c230}
.ampel i.g{background:#35c26e}
.checks{list-style:none;padding:0;max-width:520px;margin:0 auto;text-align:left}
.checks li{background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0}
.checks li.on{background:var(--ok-light)}
.step{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 12px;margin:8px auto;max-width:560px;text-align:left}
.step .name{flex:1}
.step button{width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.8rem;cursor:pointer;flex-shrink:0}
.step .val{min-width:96px;text-align:center;font-weight:bold;font-size:1rem}
.total{font-size:1.4rem;font-weight:bold;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;max-width:640px;margin:0 auto}
.tile{background:#fff;border:4px solid transparent;border-radius:18px;padding:12px;font:inherit;color:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.1);text-decoration:none;display:block;font-weight:bold}
.tile .emoji{font-size:2.8rem;display:block}
.tile.on{border-color:var(--ok);background:var(--ok-light)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="social-media.html" aria-label="Zur Übersicht">🏠</a><button class="home" id="sound" aria-label="Ton an oder aus">🔊</button></div>
  <h1>Echt oder KI? 🖼️</h1>
  <p class="sub">Finde die Fehler in den KI-Bildern.</p>
  <div id="levels">
    <p class="q">Wähle aus:</p>
    <div class="opts"><button class="opt" id="easy">⭐<br>Leicht</button><button class="opt" id="hard">⭐⭐⭐<br>Schwer</button></div>
  </div>
  <div id="game" hidden>
    <div class="progress" id="progress"></div>
    <div id="main"></div>
    <div class="feedback" id="feedback"></div>
    <div id="nav"></div>
  </div>
  <div id="end" hidden>
    <h2>Geschafft! 🎉</h2>
    <div class="stars" id="stars"></div>
    <p id="score"></p>
    <p id="merke"></p>
    <button class="btn" id="again">Nochmal spielen</button>
    <p><a class="btn alt" href="social-media.html">Zur Übersicht</a></p>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let soundOn = true;
function speak(text, force) {
  if (!soundOn && !force) return;
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    let clean = text;
    try { clean = text.replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu, ""); } catch (e) {}
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE"; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const App = {
  cfg: null, level: 1,
  init(cfg) {
    this.cfg = cfg;
    $("easy").onclick = () => this.begin(1);
    $("hard").onclick = () => this.begin(2);
    $("again").onclick = () => this.menu();
    $("sound").onclick = () => {
      soundOn = !soundOn;
      $("sound").textContent = soundOn ? "🔊" : "🔇";
      try { if (!soundOn) speechSynthesis.cancel(); } catch (e) {}
    };
    this.menu();
  },
  menu() { $("levels").hidden = false; $("game").hidden = true; $("end").hidden = true; },
  begin(level) {
    this.level = level;
    $("levels").hidden = true; $("end").hidden = true; $("game").hidden = false;
    $("main").innerHTML = ""; $("progress").innerHTML = "";
    this.clear();
    this.cfg.start(level);
  },
  progress(i, n) {
    const p = $("progress"); p.innerHTML = "";
    for (let k = 0; k < n; k++) {
      const d = document.createElement("div");
      d.className = "dot" + (k < i ? " done" : k === i ? " now" : "");
      p.appendChild(d);
    }
  },
  say(kind, text) {
    const f = $("feedback");
    f.className = "feedback " + (kind === true ? "good" : kind === false ? "bad" : "info");
    f.textContent = text;
    speak(text);
  },
  clear() { const f = $("feedback"); f.className = "feedback"; f.textContent = ""; $("nav").innerHTML = ""; },
  next(fn, label) {
    const n = $("nav");
    n.innerHTML = '<button class="btn"></button>';
    n.firstChild.textContent = label || "Weiter ➡";
    n.firstChild.onclick = fn;
  },
  stars(first, n) { return first >= n - 1 ? 3 : first >= n / 2 ? 2 : 1; },
  finish(stars, text) {
    $("game").hidden = true; $("end").hidden = false;
    $("stars").textContent = "⭐".repeat(stars);
    $("score").textContent = text;
    $("merke").innerHTML = this.cfg.merke;
    window.scrollTo(0, 0);
    speak("Geschafft! Super gemacht!");
  }
};

/* Quiz: Karte + Antwort-Knöpfe, auch mit mehreren Schritten pro Karte */
App.quiz = function (items) {
  const order = shuffle(items.slice());
  const main = $("main");
  let idx = 0, first = 0;
  const showItem = () => {
    if (idx >= order.length) {
      App.finish(App.stars(first, order.length),
        "Du hattest " + first + " von " + order.length + " Aufgaben gleich beim ersten Mal richtig.");
      return;
    }
    App.progress(idx, order.length);
    const it = order[idx];
    let clean = true, s = 0;
    const showStep = () => {
      App.clear();
      const st = it.steps[s];
      const opts = st.mix ? shuffle(st.opts.slice()) : st.opts;
      main.innerHTML =
        '<div class="card"><button class="speak" aria-label="Vorlesen">🔊</button>' +
        (it.who ? '<div class="who">👤 ' + it.who + "</div>" : "") +
        '<div class="emoji">' + it.e + '</div><div class="label">' + it.t + "</div></div>" +
        (st.q ? '<p class="q">' + st.q + "</p>" : "") +
        '<div class="opts' + (st.mix ? " col" : "") + '"></div>';
      main.querySelector(".speak").onclick = () =>
        speak([it.t, st.q || ""].concat(st.mix ? opts.map(o => o.t) : []).join(". "), true);
      const box = main.querySelector(".opts");
      let done = false;
      opts.forEach(o => {
        const b = document.createElement("button");
        b.className = "opt" + (o.c ? " " + o.c : "");
        b.textContent = o.t;
        b.onclick = () => {
          if (done) return;
          if (o.ok) {
            done = true;
            b.classList.add("right");
            box.querySelectorAll(".opt").forEach(x => { if (x !== b) x.disabled = true; });
            App.say(true, "Richtig! 👍 " + (o.h || st.h || ""));
            App.next(() => {
              s++;
              if (s < it.steps.length) showStep();
              else { if (clean) first++; idx++; showItem(); }
              window.scrollTo(0, 0);
            });
          } else {
            clean = false;
            b.classList.add("wrong");
            b.disabled = true;
            App.say(false, "Überleg nochmal! 🤔 " + (o.h || ""));
          }
        };
        box.appendChild(b);
      });
    };
    showStep();
  };
  showItem();
};

/* Finder: in einer Liste die richtigen Einträge antippen */
App.finder = function (cfg) {
  const main = $("main");
  const items = cfg.mix === false ? cfg.items : shuffle(cfg.items.slice());
  const need = items.filter(i => i.hit).length;
  let found = 0, wrong = 0;
  main.innerHTML = '<p class="q">' + cfg.intro + '</p><p class="count" id="count"></p><div class="feed"></div>';
  const upd = () => { $("count").textContent = "Gefunden: " + found + " von " + need; };
  upd();
  const feed = main.querySelector(".feed");
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "post";
    d.innerHTML = '<div class="who">' + it.who + (it.tag ? ' <span class="tag">' + it.tag + "</span>" : "") +
      '</div><div class="row"><span class="pe">' + it.e + '</span><span class="pt">' + it.t +
      '</span></div><div class="why"></div>';
    d.onclick = () => {
      if (d.dataset.done || found === need) return;
      d.dataset.done = "1";
      d.querySelector(".why").textContent = it.h;
      if (it.hit) {
        found++; upd();
        d.classList.add("found");
        App.say(true, "Gefunden! 👍 " + it.h);
        if (found === need) {
          App.next(() => App.finish(wrong === 0 ? 3 : wrong <= 2 ? 2 : 1,
            wrong === 0 ? "Du hast alles ohne Fehler gefunden!"
                        : "Du hast alles gefunden. Daneben getippt: " + wrong + " Mal."));
        }
      } else {
        wrong++;
        d.classList.add("safe", "shake");
        App.say(false, cfg.miss + " " + it.h);
      }
    };
    feed.appendChild(d);
  });
};
</script>
<script>
const SKIN = "#f2c9a0", LINE = "#3a2a1a";
const SKY = '<rect width="400" height="300" fill="#cfe8ff"/><rect y="230" width="400" height="70" fill="#9bd47a"/>';
const ROOM = '<rect width="400" height="300" fill="#fde9c9"/><rect y="235" width="400" height="65" fill="#c9a27a"/>';
const face = (cx, cy) =>
  '<circle cx="' + (cx - 13) + '" cy="' + (cy - 5) + '" r="4" fill="' + LINE + '"/><circle cx="' + (cx + 13) + '" cy="' + (cy - 5) + '" r="4" fill="' + LINE + '"/>' +
  '<path d="M' + (cx - 14) + " " + (cy + 12) + " Q" + cx + " " + (cy + 26) + " " + (cx + 14) + " " + (cy + 12) + '" fill="none" stroke="' + LINE + '" stroke-width="3" stroke-linecap="round"/>';
function hand(cx, cy, n) {
  let s = "";
  for (let k = 0; k < n; k++) {
    const a = (-65 + 130 * k / (n - 1)) * Math.PI / 180;
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.sin(a) * 40).toFixed(1) + '" y2="' + (cy - Math.cos(a) * 40).toFixed(1) +
      '" stroke="' + SKIN + '" stroke-width="9" stroke-linecap="round"/>';
  }
  return s + '<circle cx="' + cx + '" cy="' + cy + '" r="20" fill="' + SKIN + '"/>';
}
function person(x, shirt) {
  return '<rect x="' + (x - 22) + '" y="205" width="16" height="50" fill="#44506a"/><rect x="' + (x + 6) + '" y="205" width="16" height="50" fill="#44506a"/>' +
    '<rect x="' + (x - 32) + '" y="110" width="64" height="100" rx="12" fill="' + shirt + '"/>' +
    '<circle cx="' + x + '" cy="75" r="34" fill="' + SKIN + '"/>' + face(x, 75);
}
function clock() {
  const nums = ["12", "5", "2", "9", "4", "13", "6", "7", "3", "9", "1", "11"];
  let s = '<circle cx="200" cy="115" r="72" fill="#fff" stroke="' + LINE + '" stroke-width="6"/>';
  nums.forEach((n, k) => {
    const a = k * 30 * Math.PI / 180;
    s += '<text x="' + (200 + Math.sin(a) * 54).toFixed(1) + '" y="' + (121 - Math.cos(a) * 54).toFixed(1) +
      '" font-size="17" font-weight="bold" text-anchor="middle" fill="' + LINE + '" font-family="Arial">' + n + "</text>";
  });
  return s + '<line x1="200" y1="115" x2="200" y2="75" stroke="' + LINE + '" stroke-width="5" stroke-linecap="round"/>' +
    '<line x1="200" y1="115" x2="228" y2="128" stroke="' + LINE + '" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="115" r="5" fill="' + LINE + '"/>';
}

const LEICHT = [
  { q: "Eine KI hat dieses Bild gemacht. Wo ist der Fehler? Tippe darauf!",
    svg: SKY + '<line x1="165" y1="165" x2="95" y2="100" stroke="' + SKIN + '" stroke-width="16" stroke-linecap="round"/>' +
      '<line x1="235" y1="165" x2="305" y2="100" stroke="' + SKIN + '" stroke-width="16" stroke-linecap="round"/>' +
      '<rect x="160" y="150" width="80" height="110" rx="14" fill="#3b6fd8"/>' + hand(90, 92, 5) + hand(310, 92, 6) +
      '<circle cx="200" cy="110" r="40" fill="' + SKIN + '"/>' + face(200, 110),
    ring: [310, 75, 62], tip: "Zähle die Finger an beiden Händen.", h: "Die Hand hat 6 Finger. KI macht bei Händen manchmal Fehler." },
  { q: "Wo ist der Fehler im Bild? Tippe darauf!",
    svg: SKY + '<path d="M112 150 Q80 120 92 95" fill="none" stroke="#a0683a" stroke-width="12" stroke-linecap="round"/>' +
      [128, 160, 193, 226, 258].map(x => '<rect x="' + x + '" y="180" width="17" height="72" rx="8" fill="#8a5630"/>').join("") +
      '<ellipse cx="200" cy="160" rx="95" ry="42" fill="#a0683a"/><circle cx="302" cy="120" r="34" fill="#a0683a"/>' +
      '<ellipse cx="282" cy="98" rx="12" ry="24" fill="#6e4424" transform="rotate(-20 282 98)"/>' +
      '<circle cx="312" cy="112" r="5" fill="' + LINE + '"/><circle cx="334" cy="126" r="7" fill="' + LINE + '"/>',
    ring: [202, 222, 72], box: [122, 178, 160, 78], tip: "Zähle die Beine von dem Hund.", h: "Der Hund hat 5 Beine. Echte Hunde haben 4." },
  { q: "Wo ist der Fehler im Bild? Tippe darauf!",
    svg: SKY + person(200, "#2e9d5b") +
      '<line x1="170" y1="125" x2="110" y2="175" stroke="' + SKIN + '" stroke-width="15" stroke-linecap="round"/><rect x="92" y="165" width="24" height="28" rx="4" fill="#fff" stroke="' + LINE + '" stroke-width="3"/>' +
      '<line x1="230" y1="125" x2="295" y2="180" stroke="' + SKIN + '" stroke-width="15" stroke-linecap="round"/><rect x="288" y="168" width="20" height="34" rx="4" fill="#333"/>' +
      '<line x1="230" y1="140" x2="305" y2="95" stroke="' + SKIN + '" stroke-width="15" stroke-linecap="round"/><circle cx="310" cy="90" r="14" fill="' + SKIN + '"/>',
    ring: [292, 135, 68], tip: "Zähle die Arme.", h: "Die Person hat 3 Arme. Das gibt es nicht." },
  { q: "Wo ist der Fehler im Bild? Tippe darauf!",
    svg: SKY + '<rect x="80" y="100" width="240" height="160" fill="#fff3d6" stroke="' + LINE + '" stroke-width="4"/>' +
      '<rect x="180" y="170" width="46" height="90" fill="#8a5630"/><rect x="100" y="160" width="60" height="50" fill="#bfe3ff" stroke="' + LINE + '" stroke-width="3"/>' +
      '<rect x="245" y="160" width="60" height="50" fill="#bfe3ff" stroke="' + LINE + '" stroke-width="3"/><text x="130" y="197" font-size="30" text-anchor="middle">🥖</text><text x="275" y="197" font-size="30" text-anchor="middle">🥨</text>' +
      '<rect x="95" y="50" width="210" height="48" rx="8" fill="#d64545"/><text x="200" y="84" font-size="28" font-weight="bold" text-anchor="middle" fill="#fff" font-family="Arial">BÆKX7ЯΞI</text>',
    ring: [200, 74, 70], box: [95, 50, 210, 48], tip: "Lies das Schild über der Tür.", h: "Auf dem Schild steht Unsinn. KI schreibt Wörter oft falsch." },
  { q: "Wo ist der Fehler im Bild? Tippe darauf!",
    svg: ROOM + clock() + '<rect x="40" y="200" width="150" height="55" rx="14" fill="#6c8ed6"/><rect x="30" y="185" width="26" height="70" rx="10" fill="#557bc9"/><rect x="174" y="185" width="26" height="70" rx="10" fill="#557bc9"/>' +
      '<rect x="300" y="215" width="44" height="40" fill="#b5651d"/><text x="322" y="212" font-size="46" text-anchor="middle">🌿</text>',
    ring: [200, 115, 80], tip: "Schau dir die Zahlen auf der Uhr an.", h: "Die Zahlen auf der Uhr sind durcheinander." }
];

const SUCH_SCHWER = [
  { q: "Dieses KI-Bild hat einen versteckten Fehler. Tippe darauf!",
    svg: SKY + '<circle cx="55" cy="50" r="28" fill="#ffd23f"/>' +
      '<ellipse cx="135" cy="246" rx="75" ry="11" fill="#4d7a3a"/><rect x="208" y="140" width="24" height="105" fill="#8a5630"/><circle cx="220" cy="105" r="58" fill="#3f9b4b"/>' +
      '<ellipse cx="372" cy="256" rx="26" ry="6" fill="#4d7a3a"/>' +
      '<rect x="326" y="225" width="8" height="30" fill="#44506a"/><rect x="338" y="225" width="8" height="30" fill="#44506a"/><rect x="322" y="185" width="28" height="44" rx="6" fill="#d64545"/><circle cx="336" cy="170" r="15" fill="' + SKIN + '"/>',
    ring: [135, 246, 62], box: [58, 230, 155, 30], tip: "Schau auf die Schatten. Wo steht die Sonne?", h: "Die Sonne steht links. Der Schatten vom Baum muss dann nach rechts fallen." },
  { q: "Dieses KI-Bild hat einen versteckten Fehler. Tippe darauf!",
    svg: ROOM + '<rect x="215" y="35" width="150" height="225" rx="8" fill="#8a5630"/><rect x="225" y="45" width="130" height="205" fill="#dff1ff"/>' +
      '<g transform="translate(180 20) scale(0.85)">' + person(130, "#3b6fd8") + "</g>" + person(105, "#d64545"),
    ring: [290, 140, 72], box: [215, 35, 150, 225], tip: "Vergleiche das Kind und sein Spiegelbild.", h: "Der Pulli ist rot. Im Spiegel ist er blau. Das passt nicht zusammen." },
  { q: "Dieses KI-Bild hat einen versteckten Fehler. Tippe darauf!",
    svg: '<rect width="400" height="300" fill="#e6dcf5"/><path d="M95 160 Q95 30 200 35 Q305 30 305 160 Z" fill="#5a3a22"/><circle cx="200" cy="160" r="105" fill="' + SKIN + '"/>' +
      '<circle cx="155" cy="140" r="30" fill="#ffffff88" stroke="' + LINE + '" stroke-width="6"/><rect x="215" y="110" width="60" height="60" fill="#ffffff88" stroke="' + LINE + '" stroke-width="6"/>' +
      '<line x1="185" y1="140" x2="215" y2="140" stroke="' + LINE + '" stroke-width="6"/><circle cx="155" cy="142" r="6" fill="' + LINE + '"/><circle cx="245" cy="142" r="6" fill="' + LINE + '"/>' +
      '<path d="M165 215 Q200 240 235 215" fill="none" stroke="' + LINE + '" stroke-width="5" stroke-linecap="round"/>',
    ring: [200, 140, 64], box: [120, 105, 160, 70], tip: "Schau dir die Brille genau an.", h: "Die Brille hat ein rundes und ein eckiges Glas. Bei KI-Bildern passen Dinge oft nicht zusammen." }
];

const fall = (e, t, q, ...o) => ({ e, t, steps: [{ q, mix: true, opts: o }] });
const FRAGEN = [
  fall("🖼️", "Du siehst ein Bild ohne Fehler: Alle Finger stimmen, die Schrift stimmt.", "Kann das Bild trotzdem von einer KI sein?",
    { t: "Ja. Neue KI macht oft keine sichtbaren Fehler mehr.", ok: true, h: "Darum ist wichtig: Woher kommt das Bild? Kann das sein?" },
    { t: "Nein. Ohne Fehler ist ein Bild immer echt.", h: "Leider nicht. KI wird immer besser." },
    { t: "Nein. KI kann keine Hände malen.", h: "Das war früher so. Heute klappt es oft." }),
  fall("🦈", "Ein Foto zeigt einen Hai auf einer überfluteten Straße. Viele teilen es.", "Was machst du?",
    { t: "Ich teile es nicht sofort. Ich frage einen Erwachsenen.", ok: true, h: "Erst prüfen, dann teilen." },
    { t: "Ich teile es sofort. Das ist ja krass!", h: "So verbreiten sich falsche Bilder." },
    { t: "Ich glaube es. Ein Foto ist immer ein Beweis.", h: "Fotos kann man fälschen oder mit KI machen." }),
  fall("👧", "Jemand macht mit KI ein peinliches Bild von einer Mitschülerin und schickt es herum.", "Was machst du?",
    { t: "Ich schicke es nicht weiter und sage es einem Erwachsenen.", ok: true, h: "So ein Bild ist gemein und nicht erlaubt." },
    { t: "Nichts. Das Bild ist ja nicht echt, also ist es egal.", h: "Auch ein falsches Bild kann sehr weh tun." },
    { t: "Ich schicke es weiter, weil es lustig ist.", h: "Dann machst du mit." }),
  fall("🏷️", "Unter einem Bild steht klein: „KI-generiert“.", "Was heißt das?",
    { t: "Ein Computer hat das Bild gemacht. Es ist kein echtes Foto.", ok: true, h: "Achte auf solche Hinweise unter Bildern." },
    { t: "Das Bild ist besonders teuer.", h: "Mit dem Preis hat das nichts zu tun." },
    { t: "Ein Kind hat das Bild gemalt.", h: "KI heißt: künstliche Intelligenz. Das ist ein Computer-Programm." }),
  fall("🧑‍🚀", "Ein Bild zeigt einen berühmten Sänger. Er steht auf dem Mond.", "Woran merkst du am besten, dass es nicht echt ist?",
    { t: "Ich überlege: Kann das überhaupt sein?", ok: true, h: "Das ist die wichtigste Frage bei jedem Bild." },
    { t: "Das Bild hat einen Rahmen.", h: "Ein Rahmen sagt nichts darüber, ob ein Bild echt ist." },
    { t: "Das Bild ist sehr hell.", h: "Echte Fotos können auch hell sein." }),
  fall("🔎", "Du bist nicht sicher, ob ein Bild echt ist.", "Was hilft?",
    { t: "Ich schaue, wer es gepostet hat, und frage einen Erwachsenen.", ok: true, h: "Erwachsene können auch im Internet suchen, woher ein Bild kommt." },
    { t: "Ich frage in den Kommentaren.", h: "In Kommentaren kann jeder alles schreiben." },
    { t: "Ich glaube es einfach.", h: "Besser: erst prüfen." })
];

function suchen(scenes, done) {
  const main = $("main");
  let i = 0, clean = 0;
  const show = () => {
    if (i >= scenes.length) { done(clean); return; }
    App.progress(i, scenes.length);
    App.clear();
    const sc = scenes[i];
    let miss = 0, solved = false;
    main.innerHTML = '<p class="q">' + sc.q + '</p><svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" ' +
      'style="width:100%;max-width:540px;display:block;margin:0 auto;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:pointer">' + sc.svg + "</svg>";
    const svg = main.querySelector("svg");
    svg.onclick = e => {
      if (solved) return;
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left) * 400 / r.width, y = (e.clientY - r.top) * 300 / r.height;
      const dx = x - sc.ring[0], dy = y - sc.ring[1], b = sc.box;
      const inBox = b && x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3];
      if (inBox || dx * dx + dy * dy <= sc.ring[2] * sc.ring[2]) {
        solved = true;
        if (!miss) clean++;
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", sc.ring[0]); c.setAttribute("cy", sc.ring[1]); c.setAttribute("r", sc.ring[2]);
        c.setAttribute("fill", "none"); c.setAttribute("stroke", "#2e9d5b"); c.setAttribute("stroke-width", "7");
        svg.appendChild(c);
        App.say(true, "Gefunden! 👍 " + sc.h);
        App.next(() => { i++; show(); window.scrollTo(0, 0); });
      } else {
        miss++;
        svg.classList.remove("shake"); void svg.getBoundingClientRect(); svg.classList.add("shake");
        App.say(false, "Schau nochmal genau hin! 🤔 " + (miss >= 2 ? "Tipp: " + sc.tip : ""));
      }
    };
  };
  show();
}

App.init({
  merke: "Merke: <b>KI-Bilder sehen oft ganz echt aus.</b> Frag dich immer: Kann das sein? Woher kommt das Bild?",
  start(level) {
    if (level === 2) suchen(SUCH_SCHWER, () => { App.clear(); App.quiz(FRAGEN); });
    else suchen(LEICHT, clean => App.finish(App.stars(clean, LEICHT.length),
      "Du hast " + clean + " von " + LEICHT.length + " Fehlern gleich beim ersten Tippen gefunden."));
  }
});
</script>
