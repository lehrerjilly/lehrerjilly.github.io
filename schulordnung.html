<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Schulordnung-Quiz</title>
<style>
:root{--bg:#f4f7fb;--text:#1f2a37;--card:#fff;--ok:#2e9d5b;--ok-light:#dff4e7;--no:#d64545;--no-light:#fbe3e3;--accent:#3b6fd8;--accent-light:#e3ecfb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-size:1.2rem;padding:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wrap{max-width:700px;margin:0 auto;text-align:center}
.top{display:flex;justify-content:space-between}
.home{width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}
h1{font-size:2rem;margin:4px 0}
.sub{margin:0 0 12px}
.progress{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap;justify-content:center}
.dot{width:18px;height:18px;border-radius:50%;background:#cfd8e3}
.dot.done{background:var(--ok)}
.dot.now{background:var(--accent);transform:scale(1.25)}
.card{background:var(--card);border-radius:24px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:16px 56px;position:relative;margin:0 auto 12px;max-width:520px}
.card .who{font-size:1rem;color:#5a6675;text-align:left;margin-left:-40px;font-weight:bold}
.card .emoji{font-size:4rem;line-height:1.1}
.card .label{font-size:1.4rem;font-weight:bold;margin-top:8px}
.speak{position:absolute;top:8px;right:8px;border:none;background:#eef2f8;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer}
.q{font-size:1.3rem;font-weight:bold;margin:12px 0}
.opts{display:flex;gap:16px;justify-content:center}
.opts.col{flex-direction:column;align-items:stretch;max-width:560px;margin:0 auto;gap:12px}
.opt{flex:1;max-width:300px;min-height:90px;border-radius:20px;border:4px solid var(--accent);background:var(--accent-light);color:#1d3f8a;font:inherit;font-size:1.3rem;font-weight:bold;padding:12px;cursor:pointer}
.opts.col .opt{max-width:none;min-height:64px;font-weight:normal;font-size:1.2rem;text-align:left}
.opt.ok{border-color:var(--ok);background:var(--ok-light);color:#1c6b3c}
.opt.no{border-color:var(--no);background:var(--no-light);color:#9c2a2a}
.opt.right{border-color:var(--ok);background:var(--ok-light);color:#1c6b3c;font-weight:bold}
.opt:disabled{opacity:.4}
.opt.wrong{animation:shake .45s}
.feedback{min-height:56px;margin:12px auto;padding:10px 12px;border-radius:12px;max-width:600px;position:sticky;bottom:8px}
.feedback.good{background:var(--ok-light);color:#1c6b3c}
.feedback.bad{background:var(--no-light);color:#9c2a2a}
.feedback.info{background:#fff4d6;color:#7a5a00}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:16px;font:inherit;font-size:1.4rem;padding:14px 28px;cursor:pointer;margin-top:8px;text-decoration:none}
.btn.alt{background:#fff;color:var(--accent);border:3px solid var(--accent)}
.stars{font-size:3.5rem;margin:12px 0}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shake{animation:shake .45s}
.count{font-weight:bold;color:var(--accent)}
.feed{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.post{background:#fff;border:4px solid transparent;border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.1);padding:12px 14px;text-align:left;cursor:pointer}
.post .who{font-weight:bold;font-size:1rem;color:#5a6675;margin-bottom:6px}
.tag{font-weight:normal;font-size:.8rem;color:#8a94a3;margin-left:6px}
.post .row{display:flex;gap:12px;align-items:center}
.pe{font-size:2.6rem}
.post .why{font-size:1rem;margin-top:6px}
.post.found{border-color:var(--ok);background:var(--ok-light)}
.post.safe{opacity:.6;border-color:#cfd8e3}
.warn{background:#fff4d6;border:3px solid #e6b100;border-radius:16px;padding:10px;max-width:560px;margin:0 auto 12px}
.tip{background:var(--accent-light);border:3px solid var(--accent);border-radius:16px;padding:10px;max-width:560px;margin:12px auto}
.pw{width:100%;max-width:520px;font:inherit;font-size:1.6rem;padding:14px;border-radius:16px;border:4px solid #cfd8e3;text-align:center;user-select:text;-webkit-user-select:text}
.ampel{display:inline-flex;gap:10px;background:#2b3440;padding:10px 14px;border-radius:40px;margin:14px 0}
.ampel i{width:40px;height:40px;border-radius:50%;background:#55606e}
.ampel i.r{background:#e04b4b}
.ampel i.y{background:#f2c230}
.ampel i.g{background:#35c26e}
.checks{list-style:none;padding:0;max-width:520px;margin:0 auto;text-align:left}
.checks li{background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0}
.checks li.on{background:var(--ok-light)}
.step{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 12px;margin:8px auto;max-width:560px;text-align:left}
.step .name{flex:1}
.step button{width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.8rem;cursor:pointer;flex-shrink:0}
.step .val{min-width:96px;text-align:center;font-weight:bold;font-size:1rem}
.total{font-size:1.4rem;font-weight:bold;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;max-width:640px;margin:0 auto}
.tile{background:#fff;border:4px solid transparent;border-radius:18px;padding:12px;font:inherit;color:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.1);text-decoration:none;display:block;font-weight:bold}
.tile .emoji{font-size:2.8rem;display:block}
.tile.on{border-color:var(--ok);background:var(--ok-light)}
.regelliste{text-align:left;max-width:600px;margin:12px auto;padding:0;list-style:none;display:grid;gap:6px}
.regelliste li{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:8px 12px;font-size:1.05rem}
.regelliste .nr{font-weight:bold;min-width:1.6em}
.regelliste .pe{font-size:1.6rem;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="home" href="index.html" aria-label="Zur Übersicht">🏠</a><button class="home" id="sound" aria-label="Ton an oder aus">🔊</button></div>
  <h1>Unsere Schulordnung 🏫</h1>
  <p class="sub">Kennst du unsere Regeln?</p>
  <div id="levels">
    <p class="q">Wähle aus:</p>
    <div class="opts"><button class="opt" id="easy">⭐<br>Leicht</button><button class="opt" id="hard">⭐⭐⭐<br>Schwer</button></div>
  </div>
  <div id="game" hidden>
    <div class="progress" id="progress"></div>
    <div id="main"></div>
    <div class="feedback" id="feedback"></div>
    <div id="nav"></div>
  </div>
  <div id="end" hidden>
    <h2>Geschafft! 🎉</h2>
    <div class="stars" id="stars"></div>
    <p id="score"></p>
    <p id="merke"></p>
    <button class="btn" id="again">Nochmal spielen</button>
    <p><a class="btn alt" href="index.html">Zur Übersicht</a></p>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let soundOn = true;
function speak(text, force) {
  if (!soundOn && !force) return;
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    let clean = text;
    try { clean = text.replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu, ""); } catch (e) {}
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE"; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const App = {
  cfg: null, level: 1,
  init(cfg) {
    this.cfg = cfg;
    $("easy").onclick = () => this.begin(1);
    $("hard").onclick = () => this.begin(2);
    $("again").onclick = () => this.menu();
    $("sound").onclick = () => {
      soundOn = !soundOn;
      $("sound").textContent = soundOn ? "🔊" : "🔇";
      try { if (!soundOn) speechSynthesis.cancel(); } catch (e) {}
    };
    this.menu();
  },
  menu() { $("levels").hidden = false; $("game").hidden = true; $("end").hidden = true; },
  begin(level) {
    this.level = level;
    $("levels").hidden = true; $("end").hidden = true; $("game").hidden = false;
    $("main").innerHTML = ""; $("progress").innerHTML = "";
    this.clear();
    this.cfg.start(level);
  },
  progress(i, n) {
    const p = $("progress"); p.innerHTML = "";
    for (let k = 0; k < n; k++) {
      const d = document.createElement("div");
      d.className = "dot" + (k < i ? " done" : k === i ? " now" : "");
      p.appendChild(d);
    }
  },
  say(kind, text) {
    const f = $("feedback");
    f.className = "feedback " + (kind === true ? "good" : kind === false ? "bad" : "info");
    f.textContent = text;
    speak(text);
  },
  clear() { const f = $("feedback"); f.className = "feedback"; f.textContent = ""; $("nav").innerHTML = ""; },
  next(fn, label) {
    const n = $("nav");
    n.innerHTML = '<button class="btn"></button>';
    n.firstChild.textContent = label || "Weiter ➡";
    n.firstChild.onclick = fn;
  },
  stars(first, n) { return first >= n - 1 ? 3 : first >= n / 2 ? 2 : 1; },
  finish(stars, text) {
    $("game").hidden = true; $("end").hidden = false;
    $("stars").textContent = "⭐".repeat(stars);
    $("score").textContent = text;
    $("merke").innerHTML = this.cfg.merke;
    window.scrollTo(0, 0);
    speak("Geschafft! Super gemacht!");
  }
};

/* Quiz: Karte + Antwort-Knöpfe, auch mit mehreren Schritten pro Karte */
App.quiz = function (items) {
  const order = shuffle(items.slice());
  const main = $("main");
  let idx = 0, first = 0;
  const showItem = () => {
    if (idx >= order.length) {
      App.finish(App.stars(first, order.length),
        "Du hattest " + first + " von " + order.length + " Aufgaben gleich beim ersten Mal richtig.");
      return;
    }
    App.progress(idx, order.length);
    const it = order[idx];
    let clean = true, s = 0;
    const showStep = () => {
      App.clear();
      const st = it.steps[s];
      const opts = st.mix ? shuffle(st.opts.slice()) : st.opts;
      main.innerHTML =
        '<div class="card"><button class="speak" aria-label="Vorlesen">🔊</button>' +
        (it.who ? '<div class="who">👤 ' + it.who + "</div>" : "") +
        '<div class="emoji">' + it.e + '</div><div class="label">' + it.t + "</div></div>" +
        (st.q ? '<p class="q">' + st.q + "</p>" : "") +
        '<div class="opts' + (st.mix ? " col" : "") + '"></div>';
      main.querySelector(".speak").onclick = () =>
        speak([it.t, st.q || ""].concat(st.mix ? opts.map(o => o.t) : []).join(". "), true);
      const box = main.querySelector(".opts");
      let done = false;
      opts.forEach(o => {
        const b = document.createElement("button");
        b.className = "opt" + (o.c ? " " + o.c : "");
        b.textContent = o.t;
        b.onclick = () => {
          if (done) return;
          if (o.ok) {
            done = true;
            b.classList.add("right");
            box.querySelectorAll(".opt").forEach(x => { if (x !== b) x.disabled = true; });
            App.say(true, "Richtig! 👍 " + (o.h || st.h || ""));
            App.next(() => {
              s++;
              if (s < it.steps.length) showStep();
              else { if (clean) first++; idx++; showItem(); }
              window.scrollTo(0, 0);
            });
          } else {
            clean = false;
            b.classList.add("wrong");
            b.disabled = true;
            App.say(false, "Überleg nochmal! 🤔 " + (o.h || ""));
          }
        };
        box.appendChild(b);
      });
    };
    showStep();
  };
  showItem();
};

/* Finder: in einer Liste die richtigen Einträge antippen */
App.finder = function (cfg) {
  const main = $("main");
  const items = cfg.mix === false ? cfg.items : shuffle(cfg.items.slice());
  const need = items.filter(i => i.hit).length;
  let found = 0, wrong = 0;
  main.innerHTML = '<p class="q">' + cfg.intro + '</p><p class="count" id="count"></p><div class="feed"></div>';
  const upd = () => { $("count").textContent = "Gefunden: " + found + " von " + need; };
  upd();
  const feed = main.querySelector(".feed");
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "post";
    d.innerHTML = '<div class="who">' + it.who + (it.tag ? ' <span class="tag">' + it.tag + "</span>" : "") +
      '</div><div class="row"><span class="pe">' + it.e + '</span><span class="pt">' + it.t +
      '</span></div><div class="why"></div>';
    d.onclick = () => {
      if (d.dataset.done || found === need) return;
      d.dataset.done = "1";
      d.querySelector(".why").textContent = it.h;
      if (it.hit) {
        found++; upd();
        d.classList.add("found");
        App.say(true, "Gefunden! 👍 " + it.h);
        if (found === need) {
          App.next(() => App.finish(wrong === 0 ? 3 : wrong <= 2 ? 2 : 1,
            wrong === 0 ? "Du hast alles ohne Fehler gefunden!"
                        : "Du hast alles gefunden. Daneben getippt: " + wrong + " Mal."));
        }
      } else {
        wrong++;
        d.classList.add("safe", "shake");
        App.say(false, cfg.miss + " " + it.h);
      }
    };
    feed.appendChild(d);
  });
};
</script>
<script>
/* ====== UNSERE SCHULORDNUNG ======
   Hier stehen die Regeln. Sie werden in den Antworten und am Ende angezeigt. */
const REGELN = [
  ["🤝", "Wir gehen respektvoll miteinander um."],
  ["👂", "Wir halten uns an die Anweisungen der Lehrer*innen und Mitarbeiter*innen."],
  ["🗑️", "Wir gehen vernünftig mit Einrichtung und Materialien um und halten unsere Schule sauber."],
  ["⏰", "Wir erscheinen pünktlich zum Unterricht."],
  ["🟩", "Wenn wir in der Unterrichtszeit in der Schule unterwegs sind, brauchen wir einen Passierschein / eine Auftragskarte."],
  ["🛝", "Während der Pausen bleiben wir auf dem Schulhof und / oder nutzen die Pausenangebote."],
  ["📵", "Auf dem gesamten Schulgelände ist das Benutzen von Handys verboten. Die Lehrer*innen sammeln morgens die Handys in den Klassen ein und geben sie am Ende des Vormittags zurück."],
  ["🧢", "Die Schüler*innen nehmen im Klassenraum und im Verwaltungstrakt ihre Kopfbedeckungen ab."],
  ["🍎", "Während des Unterrichts wird nicht gegessen."],
  ["🍬", "Im Unterricht unterlassen wir das Kaugummi kauen (Ausnahme: bei Klassenarbeiten)."],
  ["💧", "Cola, Eistee, Energydrinks und andere teein- und koffeinhaltige Getränke dürfen nicht mit in die Schule gebracht werden."]
];
const regel = n => "Regel " + n + ": " + REGELN[n - 1][1];

/* ---------- LEICHT: Ist das erlaubt? ----------
   Pro Regel gibt es 1 oder 2 Situationen. Im Quiz kommt pro Regel eine davon. */
const JA = "✅ Erlaubt", NEIN = "❌ Nicht erlaubt";
const ja = (n, e, t) => ({ e, t, steps: [{ q: "Ist das erlaubt?", h: regel(n), opts: [
  { t: JA, c: "ok", ok: true }, { t: NEIN, c: "no", h: "Lies die Situation noch einmal." }] }] });
const nein = (n, e, t) => ({ e, t, steps: [{ q: "Ist das erlaubt?", h: regel(n), opts: [
  { t: JA, c: "ok", h: "Denk an unsere Schulordnung." }, { t: NEIN, c: "no", ok: true }] }] });

const LEICHT = [
  [ja(1, "🤝", "Du sagst „Guten Morgen“ und hältst die Tür auf."),
   nein(1, "😠", "Du beleidigst ein anderes Kind.")],
  [ja(2, "👩‍🏫", "Die Lehrerin sagt: „Setz dich bitte hin.“ Du setzt dich hin."),
   nein(2, "🙉", "Der Hausmeister sagt etwas zu dir. Du hörst einfach nicht hin.")],
  [nein(3, "🍌", "Du wirfst deinen Müll auf den Boden."),
   nein(3, "✏️", "Du malst mit dem Stift auf den Tisch.")],
  [nein(4, "🐢", "Du trödelst und kommst 10 Minuten zu spät in die Klasse."),
   ja(4, "🔔", "Es klingelt. Du gehst sofort in deine Klasse.")],
  [ja(5, "🟩", "Im Unterricht gehst du zur Toilette. Du hast die Green Card dabei."),
   nein(5, "🚶", "Im Unterricht läufst du ohne Karte durch das Schulhaus.")],
  [nein(6, "🛒", "In der Pause gehst du allein in den Supermarkt."),
   ja(6, "🛝", "In der Pause spielst du auf dem Schulhof.")],
  [nein(7, "📱", "In der Pause schreibst du auf dem Handy mit deinen Freunden."),
   ja(7, "📦", "Morgens gibst du dein Handy in der Klasse ab.")],
  [ja(8, "🧢", "Im Klassenraum nimmst du deine Mütze ab."),
   nein(8, "🧢", "Du sitzt mit Kappe auf dem Kopf im Klassenraum.")],
  [nein(9, "🍫", "Im Unterricht isst du einen Schokoriegel."),
   ja(9, "🥪", "In der Pause isst du dein Pausenbrot.")],
  [nein(10, "🍬", "In der Mathe-Stunde kaust du Kaugummi.")],
  [nein(11, "🥤", "Du bringst einen Energydrink mit in die Schule."),
   ja(11, "💧", "Du bringst eine Flasche Wasser mit in die Schule.")]
];

/* ---------- SCHWER: genau lesen, eine von drei Antworten ---------- */
const frage = (n, e, t, q, richtig, ...falsch) => ({ e, t, steps: [{ q, mix: true, h: regel(n), opts:
  [{ t: richtig, ok: true }].concat(falsch.map(f => ({ t: f[0], h: f[1] }))) }] });

const SCHWER = [
  frage(10, "📝", "Ihr schreibt eine Klassenarbeit.", "Darfst du jetzt Kaugummi kauen?",
    "Ja, bei Klassenarbeiten ist es erlaubt.",
    ["Nein, im Unterricht nie.", "Lies Regel 10 genau. Es gibt eine Ausnahme."],
    ["Nur, wenn niemand es sieht.", "Es geht nicht ums Verstecken."]),
  frage(8, "🧢", "Du bist in der Pause auf dem Schulhof und trägst eine Mütze.", "Was stimmt?",
    "Auf dem Schulhof darf ich sie aufbehalten.",
    ["Ich muss sie überall abnehmen.", "Die Regel gilt nur für bestimmte Räume."],
    ["Ich muss sie im Sekretariat abgeben.", "Das steht nicht in der Schulordnung."]),
  frage(8, "🏢", "Wo musst du deine Kopfbedeckung abnehmen?", "Wähle die richtige Antwort.",
    "Im Klassenraum und im Verwaltungstrakt.",
    ["Nur in der Turnhalle.", "Schau dir Regel 8 noch einmal an."],
    ["Auf dem Schulhof.", "Draußen darfst du sie aufbehalten."]),
  frage(7, "📱", "Es ist Schulschluss am Mittag.", "Wann bekommst du dein Handy zurück?",
    "Am Ende des Vormittags.",
    ["In der ersten Pause.", "In der Pause ist das Handy auch verboten."],
    ["Erst am nächsten Tag.", "So lange behalten die Lehrer es nicht."]),
  frage(7, "🎒", "Du kommst morgens in die Klasse.", "Was passiert mit deinem Handy?",
    "Die Lehrerin oder der Lehrer sammelt es ein.",
    ["Es bleibt aus in meiner Tasche.", "Lies Regel 7 genau: Die Handys werden eingesammelt."],
    ["Ich lege es auf meinen Tisch.", "Das Handy darf auf dem Schulgelände nicht benutzt werden."]),
  frage(5, "📨", "Im Unterricht sollst du einen Zettel ins Sekretariat bringen.", "Was brauchst du?",
    "Einen Passierschein oder eine Auftragskarte.",
    ["Nichts, ich darf einfach gehen.", "Wer im Unterricht unterwegs ist, braucht eine Karte."],
    ["Mein Handy.", "Das Handy ist auf dem Schulgelände verboten."]),
  frage(11, "🛒", "Du kaufst morgens ein Getränk für die Schule.", "Welches Getränk darfst du mitbringen?",
    "💧 Wasser",
    ["🧋 Eistee", "Eistee enthält Tein. Er ist verboten."],
    ["🥫 Cola", "Cola enthält Koffein. Sie ist verboten."]),
  frage(11, "⚡", "Warum sind Energydrinks und Cola in der Schule verboten?", "Was meinst du?",
    "Sie enthalten Koffein. Das macht unruhig und unkonzentriert.",
    ["Sie sind zu kalt.", "Die Temperatur ist nicht der Grund."],
    ["Sie schmecken nicht.", "Der Geschmack ist nicht der Grund."]),
  frage(6, "⚽", "Es ist große Pause.", "Wo darfst du sein?",
    "Auf dem Schulhof oder bei einem Pausenangebot.",
    ["Allein im Klassenraum.", "In der Pause bleiben wir auf dem Schulhof."],
    ["Beim Bäcker gegenüber.", "Du darfst das Schulgelände nicht verlassen."]),
  frage(9, "😋", "Dein Freund hat in der Deutsch-Stunde großen Hunger.", "Was ist richtig?",
    "Er wartet bis zur Pause.",
    ["Er isst heimlich unter dem Tisch.", "Im Unterricht wird nicht gegessen, auch nicht heimlich."],
    ["Er geht schnell zum Kiosk.", "Das ist nicht erlaubt."]),
  frage(3, "🖍️", "Ein Kind malt die Wand im Flur an.", "Gegen welche Regel ist das?",
    "Wir gehen vernünftig mit der Einrichtung um.",
    ["Wir erscheinen pünktlich.", "Pünktlichkeit hat damit nichts zu tun."],
    ["Kein Kaugummi im Unterricht.", "Hier geht es nicht um Kaugummi."]),
  frage(1, "😂", "Ein Kind lacht ein anderes Kind aus.", "Gegen welche Regel ist das?",
    "Wir gehen respektvoll miteinander um.",
    ["Wir halten die Schule sauber.", "Hier geht es um den Umgang miteinander."],
    ["Wir bleiben in der Pause auf dem Schulhof.", "Hier geht es um den Umgang miteinander."]),
  frage(2, "🧹", "Der Hausmeister sagt: „Bitte nicht auf der Treppe rennen.“", "Was machst du?",
    "Ich höre auf ihn. Er arbeitet an unserer Schule.",
    ["Ich höre nur auf Lehrer.", "Auch die Mitarbeiter*innen dürfen dir Anweisungen geben."],
    ["Ich renne weiter.", "Das ist gefährlich und gegen die Regel."]),
  frage(4, "🕗", "Der Unterricht beginnt um 8:00 Uhr.", "Wann bist du in der Klasse?",

];
const SCHWER_ANZAHL = 10;

App.init({
  merke: "Merke: <b>Regeln helfen uns, gut zusammen zu lernen.</b>" +
    '<ol class="regelliste">' + REGELN.map((r, i) =>
      '<li><span class="nr">' + (i + 1) + '.</span><span class="pe">' + r[0] + "</span><span>" + r[1] + "</span></li>").join("") + "</ol>",
  start(level) {
    if (level === 2) App.quiz(shuffle(SCHWER.slice()).slice(0, SCHWER_ANZAHL));
    else App.quiz(LEICHT.map(paar => paar[Math.floor(Math.random() * paar.length)]));
  }
});
