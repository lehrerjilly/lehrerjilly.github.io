<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Roboter steuern</title>
<style>
  :root {
    --bg: #fff8ee;
    --text: #2b2b2b;
    --rand: #d9cbb5;
    --feld: #ffffff;
    --feld2: #f4ecdf;
    --blau: #3a7bd5;
    --gruen: #2e9e5b;
    --rot: #d64545;
    --orange: #f08a24;
    --lila: #8a5cd1;
    --spur: #ffe38a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .oben {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; max-width: 1000px; margin: 0 auto;
  }
  .zurueck {
    font-size: 20px; text-decoration: none; color: var(--blau);
    background: #fff; border-radius: 14px; padding: 10px 16px; border: 2px solid var(--blau);
  }
  .sterne { font-size: 28px; }
  h1 { text-align: center; font-size: 32px; margin: 4px 16px; }
  .auftrag {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 22px; margin: 4px 16px 16px; text-align: center;
  }
  .lautsprecher { font-size: 28px; background: none; border: none; cursor: pointer; padding: 4px; }

  .wrap {
    max-width: 1000px; margin: 0 auto; padding: 0 16px 24px;
    display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start;
  }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; justify-items: center; } }

  .gitter {
    display: grid; gap: 6px; padding: 10px;
    background: var(--rand); border-radius: 20px;
    --zelle: min(76px, calc((100vw - 72px) / 5));
  }
  .zelle {
    width: var(--zelle); height: var(--zelle);
    background: var(--feld); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--zelle) * 0.62); position: relative;
  }
  .zelle:nth-child(odd) { background: var(--feld2); }
  .zelle.spur { background: var(--spur); }
  .zelle .roboter {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    transition: transform .2s;
  }
  .wackeln { animation: wackeln .4s; }
  @keyframes wackeln {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .jubel { animation: jubel .6s; }
  @keyframes jubel {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.4); }
  }

  .steuerung { width: 100%; max-width: 460px; }
  .bereich {
    background: rgba(255,255,255,.6); border: 3px dashed var(--rand);
    border-radius: 20px; padding: 12px; margin-bottom: 16px;
  }
  .bereich h2 { font-size: 22px; margin: 4px 4px 12px; }

  .pfeile {
    display: grid; grid-template-columns: repeat(3, 84px); grid-template-rows: repeat(2, 84px);
    gap: 10px; justify-content: center;
  }
  .pfeil {
    font-size: 44px; border: none; border-radius: 18px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  .pfeil:active { transform: translateY(3px); box-shadow: none; }
  .pfeil:disabled { opacity: .4; }
  .p-hoch { grid-column: 2; grid-row: 1; background: var(--blau); }
  .p-links { grid-column: 1; grid-row: 2; background: var(--orange); }
  .p-runter { grid-column: 2; grid-row: 2; background: var(--lila); }
  .p-rechts { grid-column: 3; grid-row: 2; background: var(--gruen); }

  .programm { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; align-items: center; }
  .programm .leer { font-size: 20px; color: #b5a68e; padding: 8px; }
  .chip {
    width: 52px; height: 52px; border-radius: 12px; color: #fff; font-size: 28px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 3px solid transparent;
  }
  .chip.aktiv { border-color: var(--text); transform: scale(1.15); }
  .c-hoch { background: var(--blau); }
  .c-links { background: var(--orange); }
  .c-runter { background: var(--lila); }
  .c-rechts { background: var(--gruen); }

  .knoepfe { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .knopf {
    font-size: 24px; font-weight: 700; color: #fff; border: none; border-radius: 18px;
    padding: 14px 24px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }
  .knopf:active { transform: translateY(3px); box-shadow: none; }
  .knopf:disabled { opacity: .4; }
  .start { background: var(--gruen); }
  .zurueck-knopf { background: var(--orange); }
  .loeschen { background: var(--rot); }
  .weiter { background: var(--blau); }

  .meldung { text-align: center; font-size: 26px; font-weight: 700; min-height: 36px; margin: 8px 16px; }
  .fertig { text-align: center; padding: 40px 16px; }
  .fertig .gross { font-size: 96px; }
  .fertig p { font-size: 28px; }
  .versteckt { display: none !important; }
</style>
</head>
<body>

<div class="oben">
  <a class="zurueck" href="index.html">⬅ Zurück</a>
  <div class="sterne" id="sterne"></div>
</div>

<div id="spiel">
  <h1 id="titel">🤖 Roboter steuern</h1>
  <p class="auftrag">
    <span id="auftrag">Bring den Roboter zum Stern!</span>
    <button class="lautsprecher" id="vorlesen" aria-label="Vorlesen">🔊</button>
  </p>

  <div class="wrap">
    <div class="gitter" id="gitter"></div>

    <div class="steuerung">
      <div class="bereich">
        <h2>🎮 Befehle</h2>
        <div class="pfeile">
          <button class="pfeil p-hoch" data-r="hoch" aria-label="hoch">⬆</button>
          <button class="pfeil p-links" data-r="links" aria-label="links">⬅</button>
          <button class="pfeil p-runter" data-r="runter" aria-label="runter">⬇</button>
          <button class="pfeil p-rechts" data-r="rechts" aria-label="rechts">➡</button>
        </div>
      </div>

      <div class="bereich">
        <h2>📋 Mein Programm</h2>
        <div class="programm" id="programm"></div>
      </div>

      <div class="knoepfe">
        <button class="knopf start" id="start">▶ Start</button>
        <button class="knopf zurueck-knopf" id="rueck">↩</button>
        <button class="knopf loeschen" id="loeschen">🗑</button>
        <button class="knopf weiter versteckt" id="weiter">Weiter ➡</button>
      </div>
    </div>
  </div>

  <div class="meldung" id="meldung"></div>
</div>

<div class="fertig versteckt" id="fertig">
  <div class="gross">🏆</div>
  <p>Super gemacht!<br>Du kannst Roboter programmieren!</p>
  <button class="knopf weiter" onclick="neustart()">🔄 Nochmal spielen</button>
</div>

<script>
// ====== HIER KANNST DU EIGENE LEVEL EINTRAGEN ======
// Spielfeld 5 x 5. Spalte x: 0 (links) bis 4 (rechts), Zeile y: 0 (oben) bis 4 (unten).
// steine = Felder, auf die der Roboter nicht fahren darf.
const LEVEL = [
  { start: [0, 2], ziel: [3, 2], steine: [],
    text: "Bring den Roboter zum Stern!" },
  { start: [0, 4], ziel: [2, 1], steine: [],
    text: "Der Stern ist oben. Bring den Roboter hin!" },
  { start: [0, 0], ziel: [4, 0], steine: [[2, 0], [2, 1]],
    text: "Achtung, Steine! Fahr außen herum." },
  { start: [0, 4], ziel: [4, 0], steine: [[1, 4], [1, 3], [3, 1], [3, 0]],
    text: "Finde einen Weg durch die Steine!" }
];
// ===================================================

const GROESSE = 5;
const SCHRITT = { hoch: [0, -1], runter: [0, 1], links: [-1, 0], rechts: [1, 0] };
const SYMBOL = { hoch: "⬆", runter: "⬇", links: "⬅", rechts: "➡" };
const MAX_BEFEHLE = 20;

let level = 0;
let programm = [];
let pos = [0, 0];
let spur = [];
let laeuft = false;
let geschafft = false;

const $ = id => document.getElementById(id);

function vorlesen(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function istStein(x, y) {
  return LEVEL[level].steine.some(([sx, sy]) => sx === x && sy === y);
}

function zeichneGitter(effekt) {
  const L = LEVEL[level];
  const g = $("gitter");
  g.style.gridTemplateColumns = `repeat(${GROESSE}, var(--zelle))`;
  g.innerHTML = "";
  for (let y = 0; y < GROESSE; y++) {
    for (let x = 0; x < GROESSE; x++) {
      const z = document.createElement("div");
      z.className = "zelle";
      if (spur.some(([sx, sy]) => sx === x && sy === y)) z.classList.add("spur");
      if (istStein(x, y)) z.textContent = "🪨";
      if (L.ziel[0] === x && L.ziel[1] === y) z.textContent = "⭐";
      if (pos[0] === x && pos[1] === y) {
        const r = document.createElement("div");
        r.className = "roboter" + (effekt ? " " + effekt : "");
        r.textContent = "🤖";
        if (L.ziel[0] === x && L.ziel[1] === y) z.textContent = "";
        z.appendChild(r);
      }
      g.appendChild(z);
    }
  }
}

function zeichneProgramm(aktiv) {
  const p = $("programm");
  p.innerHTML = "";
  if (programm.length === 0) {
    p.innerHTML = '<span class="leer">Tippe auf die Pfeile …</span>';
  }
  programm.forEach((r, i) => {
    const c = document.createElement("div");
    c.className = "chip c-" + r + (i === aktiv ? " aktiv" : "");
    c.textContent = SYMBOL[r];
    c.addEventListener("click", () => {
      if (laeuft || geschafft) return;
      programm.splice(i, 1);
      zuruecksetzen();
    });
    p.appendChild(c);
  });
  $("start").disabled = laeuft || geschafft || programm.length === 0;
  $("rueck").disabled = laeuft || geschafft || programm.length === 0;
  $("loeschen").disabled = laeuft || geschafft || programm.length === 0;
  document.querySelectorAll(".pfeil").forEach(b => {
    b.disabled = laeuft || geschafft || programm.length >= MAX_BEFEHLE;
  });
}

function zuruecksetzen() {
  pos = LEVEL[level].start.slice();
  spur = [];
  $("meldung").textContent = "";
  zeichneGitter();
  zeichneProgramm();
}

const warte = ms => new Promise(r => setTimeout(r, ms));

async function starten() {
  if (laeuft || programm.length === 0) return;
  laeuft = true;
  pos = LEVEL[level].start.slice();
  spur = [pos.slice()];
  $("meldung").textContent = "";
  zeichneGitter();
  zeichneProgramm();
  await warte(400);

  const ziel = LEVEL[level].ziel;
  for (let i = 0; i < programm.length; i++) {
    zeichneProgramm(i);
    const [dx, dy] = SCHRITT[programm[i]];
    const nx = pos[0] + dx, ny = pos[1] + dy;

    if (nx < 0 || ny < 0 || nx >= GROESSE || ny >= GROESSE || istStein(nx, ny)) {
      zeichneGitter("wackeln");
      const grund = istStein(nx, ny) ? "Autsch, ein Stein!" : "Autsch, da ist der Rand!";
      melden("💥 " + grund + " Ändere dein Programm.", "var(--rot)");
      vorlesen(grund + " Ändere dein Programm.");
      laeuft = false;
      zeichneProgramm(i);
      return;
    }

    pos = [nx, ny];
    spur.push(pos.slice());
    zeichneGitter();
    await warte(550);

    if (pos[0] === ziel[0] && pos[1] === ziel[1]) {
      zeichneGitter("jubel");
      geschafft = true;
      laeuft = false;
      melden("🎉 Geschafft! Der Roboter ist am Stern!", "var(--gruen)");
      vorlesen("Geschafft! Der Roboter ist am Stern!");
      zeichneProgramm();
      $("weiter").classList.remove("versteckt");
      return;
    }
  }

  laeuft = false;
  melden("🤔 Der Roboter ist noch nicht am Stern. Füge Befehle hinzu!", "var(--orange)");
  vorlesen("Der Roboter ist noch nicht am Stern.");
  zeichneProgramm();
}

function melden(text, farbe) {
  $("meldung").textContent = text;
  $("meldung").style.color = farbe;
}

function startLevel() {
  programm = [];
  geschafft = false;
  laeuft = false;
  $("weiter").classList.add("versteckt");
  $("titel").textContent = "🤖 Roboter steuern – Level " + (level + 1);
  $("auftrag").textContent = LEVEL[level].text;
  $("sterne").textContent = "⭐".repeat(level) + "☆".repeat(LEVEL.length - level);
  zuruecksetzen();
}

function weiter() {
  level++;
  if (level >= LEVEL.length) {
    $("spiel").classList.add("versteckt");
    $("fertig").classList.remove("versteckt");
    $("sterne").textContent = "⭐".repeat(LEVEL.length);
    vorlesen("Super gemacht! Du kannst Roboter programmieren!");
    return;
  }
  startLevel();
}

function neustart() {
  level = 0;
  $("fertig").classList.add("versteckt");
  $("spiel").classList.remove("versteckt");
  startLevel();
}

document.querySelectorAll(".pfeil").forEach(b => {
  b.addEventListener("click", () => {
    if (laeuft || geschafft || programm.length >= MAX_BEFEHLE) return;
    programm.push(b.dataset.r);
    if (spur.length) zuruecksetzen(); else zeichneProgramm();
  });
});
$("start").addEventListener("click", starten);
$("rueck").addEventListener("click", () => { programm.pop(); zuruecksetzen(); });
$("loeschen").addEventListener("click", () => { programm = []; zuruecksetzen(); });
$("weiter").addEventListener("click", weiter);
$("vorlesen").addEventListener("click", () => vorlesen(LEVEL[level].text));
startLevel();
</script>
</body>
</html>
