<body>
<div id="app"></div>
<script>
const MODUS = "steuern";
const TITEL = "🤖 Roboter steuern";

// ====== HIER KANNST DU EIGENE LEVEL EINTRAGEN ======
// R = Roboter, Z = Batterie, # = Stein, D = Diamant, . = frei
// stufe: 1 = leicht, 2 = mittel, 3 = schwer
// max (freiwillig): so viele Karten dürfen höchstens benutzt werden
const LEVEL = [
  { stufe: 1, karte: [
    ".....",
    "R...Z",
    "....."] },
  { stufe: 1, karte: [
    "R....",
    ".....",
    "....Z"] },
  { stufe: 1, karte: [
    ".....",
    "R.#.Z",
    "....."] },
  { stufe: 2, karte: [
    "..D..",
    "R...Z",
    "....."] },
  { stufe: 2, karte: [
    "R.#...",
    "..#.#.",
    "....#Z"] },
  { stufe: 2, karte: [
    "D...#Z",
    ".##...",
    "R..#.D"] },
  { stufe: 3, karte: [
    "R.#...",
    "#.#.#.",
    "..#.#D",
    ".##.#.",
    "....#Z"] },
  { stufe: 3, max: 9, tipp: "Finde den kürzesten Weg!", karte: [
    "R.....",
    ".###..",
    ".....#",
    "#.#...",
    ".....Z"] }
];
</script>
<script src="roboter.js"></script>
</body>
